[project]
name = "orbit"
version = "1.0.0"
description = "Multi-tenant SaaS starter kit: auth, billing, and usage analytics."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is handled by formatting, not a hard error.
# B008: FastAPI's Depends()/File()/Form() in argument defaults is the framework's
# documented dependency-injection pattern, not the mutable-default-argument bug this rule targets.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Support for class-based `config`:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
